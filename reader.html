
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading - NovelVerse MM</title>

    <meta
        name="description"
        content="Read your favorite novels on NovelVerse Myanmar."
    >

    <meta name="theme-color" content="#11101a">

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.png">
</head>

<body class="reader-page">

    <!-- ==========================================
         READER HEADER
    =========================================== -->

    <header class="top-header">

        <a
            href="javascript:history.back()"
            class="icon-btn"
            id="back-to-novel-btn"
            aria-label="Go back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div
            class="logo-title"
            id="reader-header-title"
        >
            Loading...
        </div>

        <div class="header-actions">

            <!-- Coin Wallet -->
            <a
                href="topup.html"
                class="reader-wallet"
                id="reader-coin-link"
                aria-label="My Coin Wallet"
            >
                <i class="fa-solid fa-coins"></i>
                <span id="header-coin-balance">0</span>
            </a>

            <!-- Account -->
            <a
                href="profile.html"
                class="icon-btn"
                id="reader-account-link"
                aria-label="My Account"
            >
                <i class="fa-solid fa-user"></i>
            </a>

        </div>

        <!-- Font Controls -->
        <div class="font-controls">

            <button
                class="font-btn"
                type="button"
                onclick="changeFontSize(-1)"
                aria-label="Decrease font size"
            >
                A-
            </button>

            <button
                class="font-btn"
                type="button"
                onclick="changeFontSize(1)"
                aria-label="Increase font size"
            >
                A+
            </button>

        </div>

    </header>


    <!-- ==========================================
         TOP ADVERTISEMENT
    =========================================== -->

    <section class="ad-section">

        <div class="ad-label">Sponsored</div>

        <div
            class="ad-container"
            id="ad-slot-grid"
        >

            <div class="ad-placeholder">
                <i class="fa-solid fa-rectangle-ad"></i>
                Banner Ad Slot
            </div>

        </div>

    </section>


    <!-- ==========================================
         MAIN READER
    =========================================== -->

    <main class="main-container">

        <!-- Chapter Title -->
        <div
            class="reader-chapter-title"
            id="chapter-title"
        >
            <!-- JavaScript inserts chapter title -->
        </div>


        <!-- Chapter Advertisement -->
        <section class="ad-section">

            <div class="ad-label">Advertisement</div>

            <div
                class="ad-container"
                id="ad-slot-header"
            >

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Banner Ad Slot
                </div>

            </div>

        </section>


        <!-- ======================================
             PREMIUM CHAPTER LOCK
        ======================================= -->

        <section
            class="chapter-lock-section"
            id="chapter-lock-section"
            aria-live="polite"
        >

            <div class="chapter-lock-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h2>Premium Chapter</h2>

            <p>
                ဤစာစဉ်သည် Premium Chapter ဖြစ်ပါသည်။
                ဆက်လက်ဖတ်ရှုရန် Coin ဖြင့် Unlock လုပ်ပေးပါ။
            </p>

            <div class="lock-price">

                <i class="fa-solid fa-coins"></i>

                <span id="chapter-unlock-price">0</span>

                Coins

            </div>

            <button
                type="button"
                class="unlock-btn"
                id="unlock-chapter-btn"
            >
                <i class="fa-solid fa-unlock-keyhole"></i>
                Coin ဖြင့် Unlock လုပ်ရန်
            </button>

            <button
                type="button"
                class="topup-btn"
                id="chapter-topup-btn"
                onclick="window.location.href='topup.html'"
            >
                <i class="fa-solid fa-wallet"></i>
                Coin ထပ်ဖြည့်ရန်
            </button>

        </section>


        <!-- ======================================
             READING CONTENT
        ======================================= -->

        <article
            class="reader-content"
            id="chapter-content"
        >

            <p class="reader-loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                စာစဉ်ကို ရယူနေသည်...
            </p>

        </article>


        <!-- Middle Advertisement -->
        <section class="ad-section">

            <div class="ad-label">Sponsored</div>

            <div
                class="ad-container"
                id="ad-slot-middle"
            >

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Native Ad
                </div>

            </div>

        </section>


        <!-- ======================================
             CHAPTER NAVIGATION
        ======================================= -->

        <div class="chapter-nav-bar">

            <button
                class="nav-btn"
                id="prev-ch-btn"
                type="button"
                onclick="navigateToChapter('prev')"
            >
                <i class="fa-solid fa-chevron-left"></i>
                ရှေ့အပိုင်း
            </button>

            <a
                href="#"
                class="nav-btn"
                id="novel-details-btn"
            >
                <i class="fa-solid fa-list-ul"></i>
                မာတိကာ
            </a>

            <button
                class="nav-btn"
                id="next-ch-btn"
                type="button"
                onclick="navigateToChapter('next')"
            >
                နောက်အပိုင်း
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </div>


        <!-- Bottom Navigation Advertisement -->
        <section class="ad-section">

            <div class="ad-label">Sponsored</div>

            <div
                class="ad-container"
                id="ad-slot-grid-bottom"
            >

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Banner Ad Slot
                </div>

            </div>

        </section>


        <!-- Bottom Advertisement -->
        <section class="ad-section">

            <div class="ad-label">Advertisement</div>

            <div
                class="ad-container"
                id="ad-slot-bottom"
            >

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Banner Ad Slot
                </div>

            </div>

        </section>

    </main>


   <!-- ==========================================
     JAVASCRIPT
========================================== -->

<!-- Advertisement System -->
<script src="ads.js"></script>

<!-- Authentication System -->
<script src="auth.js"></script>

<!-- Coin Balance System -->
<script src="coin.js"></script>

<!-- Reader System -->
<script src="reader.js"></script>

</body>
</html>
