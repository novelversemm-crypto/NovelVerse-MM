
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Theme -->
    <meta name="theme-color" content="#0d0d12">
    <meta name="color-scheme" content="dark">

    <!-- SEO -->
    <meta name="description" content="NovelVerse MM - မြန်မာဘာသာဖြင့် Novel များကို အခမဲ့နှင့် Premium ဖတ်ရှုနိုင်သော Platform">
    <meta name="keywords" content="NovelVerse MM, Myanmar Novel, Burmese Novel, Online Novel">
    <meta name="author" content="NovelVerse MM">

    <!-- Social Media Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NovelVerse MM | Read Your Favorite Novels">
    <meta property="og:description" content="သင်နှစ်သက်ရာ Novel များကို NovelVerse MM မှာ ဖတ်ရှုလိုက်ပါ။">
    <meta property="og:image" content="./icon/b0ea578f-afcf-4306-800f-343d8a8712cc.png">

    <title>NovelVerse MM | Read Your Favorite Novels</title>

    <!-- Performance: Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">
</head>

<body class="home-page">

    <!-- Skip Navigation -->
    <a href="#main-content" class="skip-link">
    </a>


    <!-- ==========================================
         HEADER
    =========================================== -->
    <header class="top-header">

        <div class="header-inner">

            <!-- Logo -->
            <a href="index.html"
               class="logo-area"
               aria-label="NovelVerse Home">

                <img
                    src="./icon/b0ea578f-afcf-4306-800f-343d8a8712cc.png"
                    alt="NovelVerse Logo"
                    class="logo-img"
                    width="42"
                    height="42"
                >

                <span class="logo-title">NovelVerse</span>

            </a>


            <!-- Header Actions -->
            <div class="header-actions">

                <!-- Search -->
                <a href="search.html"
                   class="icon-btn"
                   aria-label="Search Novels"
                   title="Search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </a>


                <!-- Coin Wallet -->
                <a href="topup.html"
                   class="header-coin"
                   id="header-coin-link"
                   aria-label="My Coin Wallet"
                   title="My Coin Wallet">

                    <i class="fa-solid fa-coins"></i>

                    <span id="header-coin-balance">0</span>

                </a>


                <!-- User Account -->
                <a href="profile.html"
                   class="icon-btn account-btn"
                   id="header-account-link"
                   aria-label="My Account"
                   title="My Account">

                    <i class="fa-regular fa-circle-user"
                       id="header-account-icon"></i>

                </a>

            </div>

        </div>

    </header>


    <!-- ==========================================
         TOP ADVERTISEMENT
    =========================================== -->
    <section class="ad-section top-ad-slot"
             aria-label="Advertisement">

        <div class="ad-label"></div>

        <div class="ad-container" id="ad-slot-header">

            <div class="ad-placeholder">
                <i class="fa-solid fa-rectangle-ad"></i>
                Loading Ad...
            </div>

        </div>

    </section>



    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->
    <main class="main-container" id="main-content">


        <!-- ======================================
             FEATURED NOVEL / HERO SECTION
        ======================================= -->
        <section class="hero-section"
                 aria-label="Featured Novel">

            <div class="hero-card" id="featured-hero">

                <!-- Hero Background Overlay -->
                <div class="hero-overlay"></div>


                <!-- Featured Image -->
                <img
                    src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop"
                    alt="Featured Novel"
                    class="hero-bg"
                    id="hero-img"
                    width="1200"
                    height="600"
                    fetchpriority="high"
                    decoding="async"
                >


                <!-- Hero Content -->
                <div class="hero-content">

                    <span class="hero-eyebrow">
                        <i class="fa-solid fa-star"></i>
                    </span>


                    <h2 class="hero-title" id="hero-title">
                        Shadow Hunter
                    </h2>


                    <p class="hero-desc" id="hero-desc">
                        The world is full of shadows, but I am the hunter who stalks the dark...
                    </p>


                    <a href="novel.html"
                       class="btn-primary"
                       id="hero-link">

                        <i class="fa-solid fa-book-open"></i>
                        ဖတ်ရှုရန်

                    </a>

                </div>

            </div>

        </section>



        <!-- ======================================
             CONTINUE READING
        ======================================= -->
        <section
            class="section-block continue-reading-block"
            id="continue-reading-section"
            style="display: none;"
        >

            <div class="section-header">

                <h3 class="section-title">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    ဆက်လက်ဖတ်ရှုရန်
                </h3>

            </div>


            <div class="continue-card" id="continue-card">
                <!-- Dynamically loaded via app.js -->
            </div>

        </section>



        <!-- ======================================
             MIDDLE ADVERTISEMENT
        ======================================= -->
        <section class="ad-section"
                 aria-label="Advertisement">

            <div class="ad-label"></div>

            <div class="ad-container" id="ad-slot-middle">

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Loading Ad...
                </div>

            </div>

        </section>



        <!-- ======================================
             LATEST CHAPTER UPDATES
        ======================================= -->
        <section class="section-block latest-section">

            <div class="section-header">

                <div class="section-heading-group">

                    <span class="section-eyebrow">
                    </span>

                    <h3 class="section-title">
                        <i class="fa-solid fa-fire"></i>
                        နောက်ဆုံးထွက် Chapter များ
                    </h3>

                </div>


                <a href="search.html"
                   class="view-all">

                    အားလုံးကြည့်ရန်
                    <i class="fa-solid fa-chevron-right"></i>

                </a>

            </div>


            <div class="novel-grid" id="latest-updates-grid">

                <!-- Loading Skeletons -->
                <div class="novel-card-skeleton"></div>
                <div class="novel-card-skeleton"></div>
                <div class="novel-card-skeleton"></div>
                <div class="novel-card-skeleton"></div>

            </div>

        </section>



        <!-- ======================================
             BOTTOM ADVERTISEMENT
        ======================================= -->
        <section class="ad-section bottom-ad-slot"
                 aria-label="Advertisement">

            <div class="ad-label"></div>

            <div class="ad-container" id="ad-slot-bottom">

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Loading Ad...
                </div>

            </div>

        </section>



        <!-- ======================================
             POPULAR NOVELS
        ======================================= -->
        <section class="section-block popular-section">

            <div class="section-header">

                <div class="section-heading-group">

                    <span class="section-eyebrow">
                    </span>

                    <h3 class="section-title">
                        <i class="fa-solid fa-chart-line"></i>
                        လူကြိုက်အများဆုံး
                    </h3>

                </div>


                <a href="search.html"
                   class="view-all">

                    အားလုံးကြည့်ရန်
                    <i class="fa-solid fa-chevron-right"></i>

                </a>

            </div>


            <div class="popular-list" id="popular-list">
                <!-- Dynamically loaded via app.js -->
            </div>

        </section>



        <!-- ======================================
             ADDITIONAL ADVERTISEMENT
        ======================================= -->
        <section class="ad-section bottom-ad-slot"
                 aria-label="Advertisement">

            <div class="ad-label"></div>

            <div class="ad-container" id="ad-slot-popular-bottom">

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Loading Ad...
                </div>

            </div>

        </section>


    </main>



    <!-- ==========================================
         BOTTOM NAVIGATION
    =========================================== -->
    <nav class="bottom-nav"
         aria-label="Main Navigation">


        <!-- Home -->
        <a href="index.html"
           class="nav-item active"
           aria-label="Home"
           aria-current="page">

            <i class="fa-solid fa-house"></i>
            <span>Home</span>

        </a>


        <!-- Search -->
        <a href="search.html"
           class="nav-item"
           aria-label="Search">

            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>

        </a>


        <!-- My Library -->
        <a href="library.html"
           class="nav-item"
           aria-label="My Library">

            <i class="fa-solid fa-bookmark"></i>
            <span>Library</span>

        </a>


        <!-- Account -->
        <a href="profile.html"
           class="nav-item"
           id="bottom-account-link"
           aria-label="My Account">

            <i class="fa-solid fa-user"></i>
            <span>Account</span>

        </a>

    </nav>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <!-- Advertisement System -->
    <script src="ads.js"></script>

    <!-- Main Website System -->
    <script src="app.js"></script>

    <!-- Existing Coin System -->
    <script src="coin.js"></script>

</body>
</html>
