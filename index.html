
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovelVerse Myanmar | Read Your Next Story</title>

    <meta
        name="description"
        content="NovelVerse Myanmar - Discover and read your favorite translated novels."
    >
    <meta name="theme-color" content="#12111a">

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.png">
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->
    <header class="top-header">

        <div class="logo-area">
            <a href="index.html" aria-label="NovelVerse Home">
                <img
                    src="./icon/b0ea578f-afcf-4306-800f-343d8a8712cc.png"
                    alt="NovelVerse Logo"
                    class="logo-img"
                >
            </a>

            <a href="index.html" class="logo-title">
                NovelVerse
            </a>
        </div>

        <div class="header-actions">

            <a
                href="search.html"
                class="icon-btn"
                aria-label="Search novels"
                title="Search"
            >
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>

        </div>

    </header>


    <!-- =========================================
         TOP ADVERTISEMENT
    ========================================== -->
    <section class="ad-section top-ad-slot">

        <div class="ad-label"></div>

        <div class="ad-container" id="ad-slot-header">

            <div class="ad-placeholder">
                <i class="fa-solid fa-rectangle-ad"></i>
                Loading Ad...
            </div>

        </div>

    </section>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->
    <main class="main-container">


        <!-- =====================================
             FEATURED NOVEL
        ====================================== -->
        <section class="hero-section">

            <div class="hero-card" id="featured-hero">

                <div class="hero-overlay"></div>

                <img
                    src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop"
                    alt="Featured Novel"
                    class="hero-bg"
                    id="hero-img"
                >

                <div class="hero-content">

                    <span class="hero-label">
                        FEATURED NOVEL
                    </span>

                    <h2 class="hero-title" id="hero-title">
                        Shadow Hunter
                    </h2>

                    <p class="hero-desc" id="hero-desc">
                        The world is full of shadows, but I am the hunter who stalks the dark...
                    </p>

                    <a
                        href="novel.html"
                        class="btn-primary"
                        id="hero-link"
                    >
                        <i class="fa-solid fa-book-open"></i>
                        ဖတ်ရှုရန်
                    </a>

                </div>

            </div>

        </section>


        <!-- =====================================
             CONTINUE READING
        ====================================== -->
        <section
            class="section-block"
            id="continue-reading-section"
            style="display: none;"
        >

            <div class="section-header">

                <h3 class="section-title">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    ဆက်လက်ဖတ်ရှုရန်
                </h3>

            </div>

            <div
                class="continue-card"
                id="continue-card"
            >
                <!-- Dynamically loaded via app.js -->
            </div>

        </section>


        <!-- =====================================
             MIDDLE ADVERTISEMENT
        ====================================== -->
        <section class="ad-section middle-ad-slot">

            <div class="ad-label"></div>

            <div class="ad-container" id="ad-slot-middle">

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Loading Ad...
                </div>

            </div>

        </section>


        <!-- =====================================
             LATEST CHAPTERS
        ====================================== -->
        <section class="section-block">

            <div class="section-header">

                <h3 class="section-title">
                    <i class="fa-solid fa-fire"></i>
                    နောက်ဆုံးထွက် Chapter များ
                </h3>

                <a href="search.html" class="view-all">
                    အားလုံးကြည့်ရန်
                    <i class="fa-solid fa-chevron-right"></i>
                </a>

            </div>

            <div
                class="novel-grid"
                id="latest-updates-grid"
            >

                <div class="novel-card-skeleton"></div>
                <div class="novel-card-skeleton"></div>
                <div class="novel-card-skeleton"></div>
                <div class="novel-card-skeleton"></div>

            </div>

        </section>


        <!-- =====================================
             BOTTOM ADVERTISEMENT
        ====================================== -->
        <section class="ad-section bottom-ad-slot">

            <div class="ad-label"></div>

            <div class="ad-container" id="ad-slot-bottom">

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Loading Ad...
                </div>

            </div>

        </section>


        <!-- =====================================
             POPULAR NOVELS
        ====================================== -->
        <section class="section-block">

            <div class="section-header">

                <h3 class="section-title">
                    <i class="fa-solid fa-chart-line"></i>
                    လူကြိုက်အများဆုံး
                </h3>

                <a href="search.html" class="view-all">
                    အားလုံးကြည့်ရန်
                    <i class="fa-solid fa-chevron-right"></i>
                </a>

            </div>

            <div
                class="popular-list"
                id="popular-list"
            >
                <!-- Dynamically loaded via app.js -->
            </div>

        </section>


        <!-- =====================================
             SECOND BOTTOM ADVERTISEMENT
        ====================================== -->
        <section class="ad-section bottom-ad-slot">

            <div class="ad-label"></div>

            <div
                class="ad-container"
                id="ad-slot-bottom-secondary"
            >

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Loading Ad...
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         BOTTOM NAVIGATION
    ========================================== -->
    <nav class="bottom-nav" aria-label="Main navigation">

        <a
            href="index.html"
            class="nav-item active"
            aria-current="page"
        >
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a
            href="search.html"
            class="nav-item"
        >
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </a>

        <a
            href="admin.html"
            class="nav-item"
        >
            <i class="fa-solid fa-user-gear"></i>
            <span>Admin</span>
        </a>

    </nav>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->
    <script src="ads.js"></script>
    <script src="app.js"></script>

</body>
</html>
