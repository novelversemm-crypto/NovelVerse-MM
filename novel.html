
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novel Details - NovelVerse</title>
    <meta name="description" content="Read novels and chapters on NovelVerse Myanmar.">

    <meta name="theme-color" content="#11101a">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./favicon.png">

    <style>
        :root {
            --novel-bg: #11101a;
            --novel-card: #1b1927;
            --novel-card-light: #242133;
            --novel-border: rgba(255,255,255,0.08);
            --novel-text: #f5f3ff;
            --novel-muted: #a6a1b5;
            --novel-purple: #9b78ff;
            --novel-purple-dark: #7651dc;
            --novel-radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--novel-bg);
            color: var(--novel-text);
            font-family: 'Poppins', 'Noto Sans Myanmar', sans-serif;
            padding-bottom: 90px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* Header */

        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 66px;
            padding: 0 5%;
            background: rgba(17,16,26,0.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--novel-border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .logo-img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .logo-title {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(110deg, #fff, #b99dff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .icon-btn {
            width: 39px;
            height: 39px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--novel-card);
            border: 1px solid var(--novel-border);
            color: #e8e2ff;
            transition: 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--novel-purple-dark);
            color: white;
        }

        /* Advertisement */

        .ad-section {
            width: min(100% - 32px, 1000px);
            margin: 20px auto;
            text-align: center;
        }

        .ad-label {
            margin-bottom: 7px;
            color: #777286;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .ad-container {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 12px;
            background: rgba(255,255,255,0.025);
        }

        .ad-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            color: #716c80;
            font-size: 12px;
        }

        /* Main */

        .main-container {
            width: min(100% - 32px, 1000px);
            margin: 0 auto;
        }

        /* Novel detail header */

        .novel-detail-header {
            position: relative;
            min-height: 270px;
            margin: 24px 0;
            padding: 28px;
            display: flex;
            align-items: center;
            gap: 28px;
            overflow: hidden;
            border: 1px solid var(--novel-border);
            border-radius: 22px;
            background:
                radial-gradient(circle at 85% 15%, rgba(130,91,220,0.2), transparent 40%),
                linear-gradient(135deg, #211d32, #191725 65%, #211b31);
            box-shadow: 0 16px 45px rgba(0,0,0,0.2);
        }

        .novel-detail-header::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            right: -100px;
            bottom: -150px;
            border-radius: 50%;
            background: rgba(151,113,255,0.12);
            filter: blur(10px);
            pointer-events: none;
        }

        .novel-detail-header > * {
            position: relative;
            z-index: 1;
        }

        .novel-detail-header img {
            width: 165px;
            height: 225px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .novel-detail-header h1,
        .novel-detail-header h2 {
            margin: 0 0 12px;
            color: #fff;
            font-size: clamp(20px, 3vw, 29px);
            line-height: 1.55;
            font-weight: 700;
        }

        .novel-detail-header p {
            color: var(--novel-muted);
            line-height: 1.8;
            font-size: 13px;
        }

        .novel-detail-header .genre,
        .novel-detail-header .status,
        .novel-detail-header .novel-meta,
        .novel-detail-header .novel-info {
            color: #c5bddb;
            font-size: 12px;
        }

        .loading-text {
            width: 100%;
            color: var(--novel-muted);
            text-align: center;
            padding: 50px 10px;
            font-size: 14px;
        }

        /* General section */

        .section-block {
            margin: 26px 0;
            padding: 22px;
            border: 1px solid var(--novel-border);
            border-radius: var(--novel-radius);
            background: var(--novel-card);
        }

        .section-title {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f2edff;
            font-size: 16px;
            font-weight: 700;
        }

        .section-title i {
            color: var(--novel-purple);
            font-size: 16px;
        }

        /* Synopsis */

        .synopsis-box {
            margin-top: 16px;
            padding: 17px;
            border-radius: 13px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.045);
            color: #c4bfd0;
            font-family: 'Noto Sans Myanmar', sans-serif;
            font-size: 13px;
            line-height: 2.05;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        /* Chapter section */

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        #chapter-count {
            color: var(--novel-purple);
            font-family: 'Poppins', sans-serif;
        }

        .sort-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 14px;
            border: 1px solid rgba(155,120,255,0.3);
            border-radius: 10px;
            background: rgba(155,120,255,0.1);
            color: #c9b7ff;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .sort-btn:hover {
            background: var(--novel-purple-dark);
            color: #fff;
        }

        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        /* Chapter rows - supports common link and div structures */

        .chapter-list > a,
        .chapter-list > div,
        .chapter-list > button {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.055);
            border-radius: 12px;
            background: rgba(255,255,255,0.025);
            color: #e9e5f2;
            transition: 0.2s ease;
        }

        .chapter-list > a:hover,
        .chapter-list > div:hover,
        .chapter-list > button:hover {
            border-color: rgba(155,120,255,0.35);
            background: rgba(155,120,255,0.075);
            transform: translateY(-1px);
        }

        .chapter-list > a *,
        .chapter-list > div *,
        .chapter-list > button * {
            max-width: 100%;
        }

        .chapter-list a,
        .chapter-list button {
            color: inherit;
        }

        .chapter-list button {
            cursor: pointer;
        }

        .chapter-list .chapter-title,
        .chapter-list .chapter-name {
            font-family: 'Noto Sans Myanmar', sans-serif;
            font-size: 13px;
            line-height: 1.7;
        }

        .chapter-list .chapter-number {
            color: var(--novel-purple);
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
        }

        /* Pagination */

        #chapter-pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 22px;
        }

        #chapter-pagination-container button,
        #chapter-pagination-container a {
            min-width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            border: 1px solid var(--novel-border);
            border-radius: 9px;
            background: var(--novel-card-light);
            color: #d6d0e5;
            font-size: 12px;
            cursor: pointer;
        }

        #chapter-pagination-container button:hover,
        #chapter-pagination-container a:hover {
            border-color: var(--novel-purple);
            color: white;
        }

        #chapter-pagination-container .active,
        #chapter-pagination-container button.active,
        #chapter-pagination-container a.active {
            border-color: var(--novel-purple);
            background: var(--novel-purple-dark);
            color: #fff;
        }

        /* Bottom navigation */

        .bottom-nav {
            position: fixed;
            z-index: 100;
            left: 0;
            right: 0;
            bottom: 0;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 5px 8%;
            background: rgba(25,23,36,0.96);
            border-top: 1px solid var(--novel-border);
            backdrop-filter: blur(18px);
        }

        .nav-item {
            min-width: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #817b91;
            font-size: 10px;
            transition: 0.2s ease;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #b99dff;
        }

        /* Responsive */

        @media (max-width: 600px) {
            .top-header {
                height: 60px;
                padding: 0 16px;
            }

            .main-container {
                width: calc(100% - 24px);
            }

            .ad-section {
                width: calc(100% - 24px);
                margin: 15px auto;
            }

            .novel-detail-header {
                min-height: auto;
                padding: 18px;
                gap: 16px;
                align-items: flex-start;
                border-radius: 17px;
            }

            .novel-detail-header img {
                width: 112px;
                height: 158px;
                border-radius: 10px;
            }

            .novel-detail-header h1,
            .novel-detail-header h2 {
                font-size: 17px;
                line-height: 1.55;
            }

            .novel-detail-header p {
                font-size: 11px;
                line-height: 1.7;
            }

            .section-block {
                padding: 16px;
                margin: 18px 0;
                border-radius: 15px;
            }

            .section-title {
                font-size: 14px;
            }

            .synopsis-box {
                padding: 13px;
                font-size: 12px;
                line-height: 1.95;
            }

            .section-header {
                align-items: flex-start;
            }

            .sort-btn {
                padding: 8px 10px;
                font-size: 11px;
                white-space: nowrap;
            }

            .chapter-list > a,
            .chapter-list > div,
            .chapter-list > button {
                min-height: 53px;
                padding: 10px 12px;
            }

            .chapter-list .chapter-title,
            .chapter-list .chapter-name {
                font-size: 12px;
            }

            .bottom-nav {
                padding: 5px 12%;
            }
        }

        @media (max-width: 360px) {
            .novel-detail-header {
                gap: 12px;
                padding: 14px;
            }

            .novel-detail-header img {
                width: 96px;
                height: 140px;
            }

            .novel-detail-header h1,
            .novel-detail-header h2 {
                font-size: 15px;
            }

            .section-block {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="top-header">
        <a href="javascript:history.back()" class="icon-btn" aria-label="Go back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="logo-area">
            <img
                src="./icon/b0ea578f-afcf-4306-800f-343d8a8712cc.png"
                alt="NovelVerse Logo"
                class="logo-img"
            >
            <span class="logo-title">NovelVerse</span>
        </div>

        <a href="search.html" class="icon-btn" aria-label="Search novels">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
    </header>

    <!-- Top Advertisement -->
    <section class="ad-section">
        <div class="ad-label">Advertisement</div>
        <div class="ad-container" id="ad-slot-header">
            <div class="ad-placeholder">
                <i class="fa-solid fa-rectangle-ad"></i>
                Banner Ad Slot
            </div>
        </div>
    </section>

    <main class="main-container">

        <!-- Novel Information -->
        <section
            class="novel-detail-header"
            id="novel-header-container"
        >
            <div class="loading-text">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading Novel Info...
            </div>
        </section>

        <!-- Advertisement -->
        <section class="ad-section">
            <div class="ad-label">Advertisement</div>
            <div class="ad-container" id="ad-slot-middle">
                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Banner Ad Slot
                </div>
            </div>
        </section>

        <!-- Synopsis -->
        <section class="section-block">
            <h3 class="section-title">
                <i class="fa-solid fa-book-open"></i>
                အညွှန်း (Synopsis)
            </h3>

            <div class="synopsis-box" id="novel-synopsis"></div>
        </section>

        <!-- Chapter List -->
        <section class="section-block">

            <div class="section-header">
                <h3 class="section-title">
                    <i class="fa-solid fa-list-ol"></i>
                    စာစဉ်များ
                    (<span id="chapter-count">0</span>)
                </h3>

                <button
                    class="sort-btn"
                    onclick="toggleChapterSort()"
                    id="sort-btn"
                    type="button"
                >
                    <i class="fa-solid fa-arrow-down-short-wide"></i>
                    New
                </button>
            </div>

            <div
                class="chapter-list"
                id="chapter-list-container"
            ></div>

            <!-- Chapter Pagination -->
            <div
                id="chapter-pagination-container"
                style="display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:8px; margin-top:20px;"
            ></div>

        </section>

        <!-- Bottom Advertisement -->
        <section class="ad-section">
            <div class="ad-label">Sponsored</div>

            <div class="ad-container" id="ad-slot-bottom">
                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Native Ad
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="search.html" class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </a>

        <a href="admin.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>Admin</span>
        </a>
    </nav>

    <!-- JavaScript Files -->
    <script src="ads.js"></script>
    <script src="novel.js"></script>

</body>
</html>
