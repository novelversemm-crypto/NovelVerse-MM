
<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0d0d12">
    <meta name="description" content="NovelVerse MM - Novel Details, Synopsis and Chapters">

    <title>Novel Details | NovelVerse MM</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.png">
</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->
    <header class="top-header">

        <!-- Back Button -->
        <a href="javascript:history.back()"
           class="icon-btn"
           aria-label="Go Back">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <!-- Logo -->
        <a href="index.html" class="logo-area">

            <img
                src="./icon/b0ea578f-afcf-4306-800f-343d8a8712cc.png"
                alt="NovelVerse Logo"
                class="logo-img"
            >

            <span class="logo-title">NovelVerse</span>

        </a>

        <!-- Header Actions -->
        <div class="header-actions">

            <!-- Search -->
            <a href="search.html"
               class="icon-btn"
               aria-label="Search">

                <i class="fa-solid fa-magnifying-glass"></i>

            </a>

            <!-- Coin Wallet -->
            <a href="topup.html"
               class="header-coin"
               id="header-coin-link"
               aria-label="My Coin Wallet">

                <i class="fa-solid fa-coins"></i>

                <span id="header-coin-balance">0</span>

            </a>

            <!-- Account -->
            <a href="topup.html"
               class="icon-btn account-btn"
               id="header-account-link"
               aria-label="My Account">

                <i class="fa-regular fa-circle-user"
                   id="header-account-icon"></i>

            </a>

        </div>

    </header>


    <!-- ==========================================
         TOP ADVERTISEMENT
    =========================================== -->
    <section class="ad-section">

        <div class="ad-label"></div>

        <div class="ad-container" id="ad-slot-header">

            <div class="ad-placeholder">
                <i class="fa-solid fa-rectangle-ad"></i>
                Banner Ad Slot
            </div>

        </div>

    </section>


    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->
    <main class="main-container">


        <!-- ======================================
             NOVEL INFORMATION
        ======================================= -->
        <section
            class="novel-detail-header"
            id="novel-header-container"
        >

            <div class="loading-text">
                Loading Novel Info...
            </div>

        </section>


        <!-- ======================================
             NOVEL ACTIONS
        ======================================= -->
        <section class="section-block novel-actions-section">

            <div class="novel-actions">

                <!-- Add / Remove from Library -->
                <button
                    type="button"
                    class="novel-library-btn"
                    id="novel-library-btn"
                    aria-label="Add to My Library"
                    aria-pressed="false"
                >

                    <i class="fa-regular fa-bookmark"
                       id="novel-library-icon"></i>

                    <span id="novel-library-text">
                        My Library ထဲသိမ်းရန်
                    </span>

                </button>

                <!-- Share Novel -->
                <button
                    type="button"
                    class="novel-share-btn"
                    id="novel-share-btn"
                    aria-label="Share Novel"
                >

                    <i class="fa-solid fa-share-nodes"></i>

                    <span>Share</span>

                </button>

            </div>

        </section>


        <!-- ======================================
             MIDDLE ADVERTISEMENT
        ======================================= -->
        <section class="ad-section">

            <div class="ad-label"></div>

            <div class="ad-container" id="ad-slot-middle">

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Banner Ad Slot
                </div>

            </div>

        </section>


        <!-- ======================================
             NOVEL SYNOPSIS
        ======================================= -->
        <section class="section-block">

            <h3 class="section-title">

                <i class="fa-solid fa-book-open"></i>

                အညွှန်း (Synopsis)

            </h3>

            <div
                class="synopsis-box"
                id="novel-synopsis"
            >

                <!-- Dynamically loaded via novel.js -->

            </div>

        </section>


        <!-- ======================================
             CHAPTER LIST
        ======================================= -->
        <section class="section-block">

            <div class="section-header">

                <h3 class="section-title">

                    <i class="fa-solid fa-list-ol"></i>

                    စာစဉ်များ
                    (<span id="chapter-count">0</span>)

                </h3>

                <!-- Chapter Sorting -->
                <button
                    type="button"
                    class="sort-btn"
                    onclick="toggleChapterSort()"
                    id="sort-btn"
                >

                    <i class="fa-solid fa-arrow-down-short-wide"></i>

                    New

                </button>

            </div>


            <!-- Chapter List -->
            <div
                class="chapter-list"
                id="chapter-list-container"
            >

                <!-- Dynamically loaded via novel.js -->

            </div>


            <!-- Chapter Pagination -->
            <div
                id="chapter-pagination-container"
                class="chapter-pagination"
                aria-label="Chapter Pagination"
            >

                <!-- Dynamically loaded via novel.js -->

            </div>

        </section>


        <!-- ======================================
             BOTTOM ADVERTISEMENT
        ======================================= -->
        <section class="ad-section">

            <div class="ad-label"></div>

            <div class="ad-container" id="ad-slot-bottom">

                <div class="ad-placeholder">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    Native Ad
                </div>

            </div>

        </section>


    </main>


    <!-- ==========================================
         BOTTOM NAVIGATION
    =========================================== -->
    <nav class="bottom-nav" aria-label="Main Navigation">

        <!-- Home -->
        <a href="index.html" class="nav-item">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>


        <!-- Search -->
        <a href="search.html" class="nav-item">

            <i class="fa-solid fa-magnifying-glass"></i>

            <span>Search</span>

        </a>


        <!-- Library -->
        <a href="library.html" class="nav-item">

            <i class="fa-solid fa-bookmark"></i>

            <span>Library</span>

        </a>


        <!-- Account -->
        <a href="topup.html" class="nav-item" id="bottom-account-link">

            <i class="fa-solid fa-user"></i>

            <span>Account</span>

        </a>

    </nav>


    <!-- ==========================================
         JAVASCRIPT FILES
    =========================================== -->

    <!-- Advertisement System -->
    <script src="ads.js"></script>

    <!-- Novel Details & Chapter System -->
    <script src="novel.js"></script>

    <!-- Account & Coin System -->
    <script src="coin.js"></script>

</body>
</html>
