
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search & Filter - NovelVerse MM</title>

    <meta
        name="description"
        content="Discover and search novels on NovelVerse Myanmar."
    >

    <meta name="theme-color" content="#11101a">

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.png">
</head>

<body class="search-page">

    <!-- ==========================================
         HEADER & SEARCH
    =========================================== -->

    <header class="top-header search-header">

        <!-- Logo -->
        <div class="logo-area">

            <img
                src="./icon/b0ea578f-afcf-4306-800f-343d8a8712cc.png"
                alt="NovelVerse Logo"
                class="logo-img"
            >

            <span class="logo-title">
                NovelVerse
            </span>

        </div>


        <!-- Coin & Account -->
        <div class="header-actions">

            <!-- Coin Wallet -->
            <a
                href="topup.html"
                class="header-action coin-action"
                id="header-coin-link"
                aria-label="My Coin Wallet"
            >

                <i class="fa-solid fa-coins"></i>

                <span>
                    <span id="header-coin-balance">0</span>
                    Coins
                </span>

            </a>


            <!-- Account -->
            <a
                href="profile.html"
                class="header-action"
                id="header-account-link"
                aria-label="My Account"
            >

                <i class="fa-solid fa-user"></i>

                <span>Account</span>

            </a>

        </div>


        <!-- Search Input -->
        <div class="search-box-wrap">

            <i class="fa-solid fa-magnifying-glass search-icon"></i>

            <input
                type="text"
                id="search-input"
                placeholder="နိုဗယ်ခေါင်းစဉ် ရှာရန်..."
                oninput="filterNovels()"
                autocomplete="off"
                aria-label="Search novels"
            >

        </div>

    </header>


    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main class="main-container">


        <!-- ======================================
             TOP ADVERTISEMENT
        ======================================= -->

        <section class="ad-section top-ad-slot">

            <div class="ad-label">
                Advertisement
            </div>

            <div
                class="ad-container"
                id="ad-slot-header"
            >

                <div class="ad-placeholder">

                    <i class="fa-solid fa-rectangle-ad"></i>

                    Loading Ad...

                </div>

            </div>

        </section>


        <!-- ======================================
             STATUS FILTER
        ======================================= -->

        <section class="filter-section">

            <div class="filter-title">

                <i class="fa-solid fa-filter"></i>

                Status အလိုက်ကြည့်ရန်

            </div>


            <div class="status-tags">

                <button
                    class="status-btn active"
                    data-status="all"
                    onclick="setStatusFilter('all', this)"
                    type="button"
                >
                    All
                </button>


                <button
                    class="status-btn"
                    data-status="Ongoing"
                    onclick="setStatusFilter('Ongoing', this)"
                    type="button"
                >
                    Ongoing
                </button>


                <button
                    class="status-btn"
                    data-status="Completed"
                    onclick="setStatusFilter('Completed', this)"
                    type="button"
                >
                    Completed
                </button>

            </div>

        </section>


        <!-- ======================================
             GENRE FILTER
        ======================================= -->

        <section class="filter-section">

            <div class="filter-title genre-filter-title">

                <span>

                    <i class="fa-solid fa-layer-group"></i>

                    Genres / အမျိုးအစားများ

                </span>


                <button
                    class="genre-reset-btn"
                    onclick="clearAllGenres()"
                    type="button"
                >
                    Reset
                </button>

            </div>


            <div class="genre-grid">

                <!-- All -->
                <button
                    class="genre-chip active"
                    data-genre="all"
                    onclick="toggleGenreFilter('all', this)"
                    type="button"
                >
                    <i class="fa-solid fa-border-all"></i>
                    All
                </button>


                <!-- Action -->
                <button
                    class="genre-chip"
                    data-genre="Action"
                    onclick="toggleGenreFilter('Action', this)"
                    type="button"
                >
                    <i class="fa-solid fa-burst"></i>
                    Action
                </button>


                <!-- Adventure -->
                <button
                    class="genre-chip"
                    data-genre="Adventure"
                    onclick="toggleGenreFilter('Adventure', this)"
                    type="button"
                >
                    <i class="fa-solid fa-compass"></i>
                    Adventure
                </button>


                <!-- Fantasy -->
                <button
                    class="genre-chip"
                    data-genre="Fantasy"
                    onclick="toggleGenreFilter('Fantasy', this)"
                    type="button"
                >
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Fantasy
                </button>


                <!-- System -->
                <button
                    class="genre-chip"
                    data-genre="System"
                    onclick="toggleGenreFilter('System', this)"
                    type="button"
                >
                    <i class="fa-solid fa-microchip"></i>
                    System
                </button>


                <!-- Murim -->
                <button
                    class="genre-chip"
                    data-genre="Murim"
                    onclick="toggleGenreFilter('Murim', this)"
                    type="button"
                >
                    <i class="fa-solid fa-yin-yang"></i>
                    Murim
                </button>


                <!-- Martial Arts -->
                <button
                    class="genre-chip"
                    data-genre="Martial Arts"
                    onclick="toggleGenreFilter('Martial Arts', this)"
                    type="button"
                >
                    <i class="fa-solid fa-hand-fist"></i>
                    Martial Arts
                </button>


                <!-- Rebirth -->
                <button
                    class="genre-chip"
                    data-genre="Rebirth"
                    onclick="toggleGenreFilter('Rebirth', this)"
                    type="button"
                >
                    <i class="fa-solid fa-rotate-left"></i>
                    Rebirth
                </button>


                <!-- Xianxia -->
                <button
                    class="genre-chip"
                    data-genre="Xianxia"
                    onclick="toggleGenreFilter('Xianxia', this)"
                    type="button"
                >
                    <i class="fa-solid fa-dragon"></i>
                    Xianxia
                </button>


                <!-- Romance -->
                <button
                    class="genre-chip"
                    data-genre="Romance"
                    onclick="toggleGenreFilter('Romance', this)"
                    type="button"
                >
                    <i class="fa-solid fa-heart"></i>
                    Romance
                </button>


                <!-- Comedy -->
                <button
                    class="genre-chip"
                    data-genre="Comedy"
                    onclick="toggleGenreFilter('Comedy', this)"
                    type="button"
                >
                    <i class="fa-solid fa-face-laugh-beam"></i>
                    Comedy
                </button>


                <!-- Sci-Fi -->
                <button
                    class="genre-chip"
                    data-genre="Sci-Fi"
                    onclick="toggleGenreFilter('Sci-Fi', this)"
                    type="button"
                >
                    <i class="fa-solid fa-robot"></i>
                    Sci-Fi
                </button>


                <!-- Mystery -->
                <button
                    class="genre-chip"
                    data-genre="Mystery"
                    onclick="toggleGenreFilter('Mystery', this)"
                    type="button"
                >
                    <i class="fa-solid fa-user-secret"></i>
                    Mystery
                </button>


                <!-- Horror -->
                <button
                    class="genre-chip"
                    data-genre="Horror"
                    onclick="toggleGenreFilter('Horror', this)"
                    type="button"
                >
                    <i class="fa-solid fa-ghost"></i>
                    Horror
                </button>


                <!-- Supernatural -->
                <button
                    class="genre-chip"
                    data-genre="Supernatural"
                    onclick="toggleGenreFilter('Supernatural', this)"
                    type="button"
                >
                    <i class="fa-solid fa-skull"></i>
                    Supernatural
                </button>


                <!-- Isekai -->
                <button
                    class="genre-chip"
                    data-genre="Isekai"
                    onclick="toggleGenreFilter('Isekai', this)"
                    type="button"
                >
                    <i class="fa-solid fa-door-open"></i>
                    Isekai
                </button>


                <!-- Harem -->
                <button
                    class="genre-chip"
                    data-genre="Harem"
                    onclick="toggleGenreFilter('Harem', this)"
                    type="button"
                >
                    <i class="fa-solid fa-users"></i>
                    Harem
                </button>


                <!-- Slice of Life -->
                <button
                    class="genre-chip"
                    data-genre="Slice of Life"
                    onclick="toggleGenreFilter('Slice of Life', this)"
                    type="button"
                >
                    <i class="fa-solid fa-mug-hot"></i>
                    Slice of Life
                </button>


                <!-- Drama -->
                <button
                    class="genre-chip"
                    data-genre="Drama"
                    onclick="toggleGenreFilter('Drama', this)"
                    type="button"
                >
                    <i class="fa-solid fa-masks-theater"></i>
                    Drama
                </button>


                <!-- BL -->
                <button
                    class="genre-chip"
                    data-genre="BL"
                    onclick="toggleGenreFilter('BL', this)"
                    type="button"
                >
                    <i class="fa-solid fa-heart-circle-bolt"></i>
                    BL
                </button>


                <!-- Yuri -->
                <button
                    class="genre-chip"
                    data-genre="Yuri"
                    onclick="toggleGenreFilter('Yuri', this)"
                    type="button"
                >
                    <i class="fa-solid fa-heart-pulse"></i>
                    Yuri
                </button>


                <!-- Psychological -->
                <button
                    class="genre-chip"
                    data-genre="Psychological"
                    onclick="toggleGenreFilter('Psychological', this)"
                    type="button"
                >
                    <i class="fa-solid fa-brain"></i>
                    Psychological
                </button>


                <!-- Thriller -->
                <button
                    class="genre-chip"
                    data-genre="Thriller"
                    onclick="toggleGenreFilter('Thriller', this)"
                    type="button"
                >
                    <i class="fa-solid fa-bolt"></i>
                    Thriller
                </button>

            </div>

        </section>


        <!-- ======================================
             SEARCH RESULTS
        ======================================= -->

        <section class="section-block">

            <div class="section-header">

                <h3 class="section-title">

                    <i class="fa-solid fa-list-ul"></i>

                    ရလဒ်များ

                    (<span id="result-count">0</span>)

                </h3>

            </div>


            <!-- Results generated by search.js -->
            <div
                class="novel-grid"
                id="search-results-grid"
            >
            </div>


            <!-- Pagination -->
            <div id="pagination-container"></div>

        </section>


        <!-- ======================================
             BOTTOM ADVERTISEMENT
        ======================================= -->

        <section class="ad-section bottom-ad-slot">

            <div class="ad-label">
                Sponsored
            </div>

            <div
                class="ad-container"
                id="ad-slot-bottom"
            >

                <div class="ad-placeholder">

                    <i class="fa-solid fa-rectangle-ad"></i>

                    Loading Ad...

                </div>

            </div>

        </section>

    </main>


    <!-- ==========================================
         BOTTOM NAVIGATION
    =========================================== -->

    <nav class="bottom-nav" aria-label="Main navigation">

        <a
            href="index.html"
            class="nav-item"
        >
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>


        <a
            href="search.html"
            class="nav-item active"
            aria-current="page"
        >
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </a>


        <a
            href="library.html"
            class="nav-item"
        >
            <i class="fa-solid fa-bookmark"></i>
            <span>Library</span>
        </a>


        <a
            href="profile.html"
            class="nav-item"
        >
            <i class="fa-solid fa-user"></i>
            <span>Account</span>
        </a>

    </nav>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <!-- Advertisement Logic -->
    <script src="ads.js"></script>

    <!-- Search & Filter Logic -->
    <script src="search.js"></script>

    <script src="coin.js"></script>

</body>
</html>
